<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>点击飘爱心 ❤</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
        }
        canvas { display: block; }
        .hint {
            position: absolute;
            top: 6%;
            width: 100%;
            text-align: center;
            color: #ff9db3;
            font-size: 15px;
            letter-spacing: 3px;
            pointer-events: none;
            animation: blink 2s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <canvas id="heart"></canvas>
    <div class="hint">点击屏幕，飘出爱心 ❤</div>

    <script>
        const canvas = document.getElementById("heart");
        const ctx = canvas.getContext("2d");
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        // 爱心参数方程：x = 16sin³t ; y = 13cost - 5cos2t - 2cos3t - cos4t
        function heartPoint(t, s) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return { x: x * s, y: -y * s };
        }

        // 沿心形路径描边（供填充使用）
        function traceHeart(s) {
            ctx.beginPath();
            for (let t = 0; t <= Math.PI * 2; t += 0.06) {
                const p = heartPoint(t, s);
                if (t === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            }
            ctx.closePath();
        }

        // 花朵背景：多朵飘落绽放的花朵
        function drawFlower(x, y, size, rotation, petalColor, centerColor) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            const petals = 6;
            for (let i = 0; i < petals; i++) {
                ctx.rotate((Math.PI * 2) / petals);
                ctx.beginPath();
                ctx.ellipse(0, -size * 0.5, size * 0.28, size * 0.5, 0, 0, Math.PI * 2);
                ctx.fillStyle = petalColor;
                ctx.fill();
            }
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.22, 0, Math.PI * 2);
            ctx.fillStyle = centerColor;
            ctx.fill();
            ctx.restore();
        }

        const flowerColors = [
            { petal: "#ff8fab", center: "#ffe5b4" },
            { petal: "#ffb3c6", center: "#fff1a8" },
            { petal: "#ffd6e0", center: "#ffc0cb" },
            { petal: "#e0b3ff", center: "#ffe5b4" },
            { petal: "#ffc2d1", center: "#fff0f3" },
            { petal: "#c9b6ff", center: "#ffe8a3" }
        ];
        const flowers = [];
        const flowerCount = 460;
        for (let i = 0; i < flowerCount; i++) {
            flowers.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: 10 + Math.random() * 22,
                rotation: Math.random() * Math.PI * 2,
                vr: (Math.random() - 0.5) * 0.02,
                vy: 0.3 + Math.random() * 0.8,
                sway: 0.5 + Math.random() * 1.5,
                phase: Math.random() * Math.PI * 2,
                color: flowerColors[i % flowerColors.length]
            });
        }

        // 背景：聚合成爱心的粒子
        const particles = [];
        const count = 850;
        for (let i = 0; i < count; i++) {
            const p = heartPoint((i / count) * Math.PI * 2, 1);
            particles.push({
                baseX: p.x,
                baseY: p.y,
                x: (Math.random() - 0.5) * width * 1.6,
                y: (Math.random() - 0.5) * height * 1.6,
                size: Math.random() * 2.5 + 1,
                hue: Math.random() * 40 + 330,
                speed: Math.random() * 0.02 + 0.01
            });
        }

        // 文字粒子：把「赵文静」采样成颗粒
        function sampleTextParticles(text, fontSize) {
            const off = document.createElement("canvas");
            const octx = off.getContext("2d");
            const font = `bold ${fontSize}px "Youyuan", "幼圆", "STHupo", "华文琥珀", "Comic Sans MS", "Microsoft YaHei", sans-serif`;
            octx.font = font;
            const tw = Math.ceil(octx.measureText(text).width);
            const th = Math.ceil(fontSize * 1.3);
            off.width = tw;
            off.height = th;
            octx.font = font;
            octx.fillStyle = "#fff";
            octx.textBaseline = "top";
            octx.textAlign = "left";
            octx.fillText(text, 0, fontSize * 0.15);
            const data = octx.getImageData(0, 0, tw, th).data;
            const pts = [];
            const gap = 4;
            for (let y = 0; y < th; y += gap) {
                for (let x = 0; x < tw; x += gap) {
                    if (data[(y * tw + x) * 4 + 3] > 128) {
                        pts.push({ x, y });
                    }
                }
            }
            return { points: pts, width: tw, height: th };
        }

        const fontSize = Math.max(64, Math.min(width, height) * 0.15);
        const tp = sampleTextParticles("赵文静", fontSize);
        const textParticles = tp.points.map((p) => ({
            baseX: p.x - tp.width / 2,
            baseY: p.y - tp.height / 2,
            x: (Math.random() - 0.5) * width,
            y: (Math.random() - 0.5) * height,
            size: Math.random() * 1.1 + 0.9,
            hue: Math.random() * 30 + 330,
            speed: Math.random() * 0.03 + 0.02
        }));

        // 点击后飘出的爱心
        const floating = [];

        function spawnHearts(x, y) {
            const n = 10 + Math.floor(Math.random() * 8);
            for (let i = 0; i < n; i++) {
                const size = 8 + Math.random() * 24;
                const angle = Math.random() * Math.PI * 2;
                const sp = 1 + Math.random() * 3;
                floating.push({
                    x: x, y: y,
                    size: size,
                    vx: Math.cos(angle) * sp * 0.7,
                    vy: -2 - Math.random() * 3,
                    rotation: (Math.random() - 0.5) * 0.8,
                    vr: (Math.random() - 0.5) * 0.06,
                    hue: Math.random() * 30 + 330,
                    opacity: 1,
                    life: 1
                });
            }
        }

        canvas.addEventListener("click", (e) => {
            spawnHearts(e.clientX, e.clientY);
        });
        // 手机触摸支持
        canvas.addEventListener("touchstart", (e) => {
            for (const t of e.changedTouches) spawnHearts(t.clientX, t.clientY);
        }, { passive: true });

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // 0. 背景花朵（淡化融入背景）
            const time = Date.now() / 1000;
            ctx.globalAlpha = 0.3;
            flowers.forEach((f) => {
                f.y += f.vy;
                f.rotation += f.vr;
                f.x += Math.sin(time + f.phase) * f.sway * 0.3;
                if (f.y > height + 40) {
                    f.y = -40;
                    f.x = Math.random() * width;
                }
                if (f.x > width + 40) f.x = -40;
                if (f.x < -40) f.x = width + 40;
                drawFlower(f.x, f.y, f.size, f.rotation, f.color.petal, f.color.center);
            });
            ctx.globalAlpha = 1;

            const beat = 1 + Math.sin(Date.now() / 400) * 0.06;
            const cx = width / 2;
            const cy = height / 2 - 20;

            // 1. 背景爱心
            const scale = (Math.min(width, height) / 40) * beat;
            particles.forEach((p) => {
                const tx = cx + p.baseX * scale;
                const ty = cy + p.baseY * scale;
                p.x += (tx - p.x) * p.speed;
                p.y += (ty - p.y) * p.speed;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${p.hue}, 100%, ${60 + Math.sin(Date.now() / 300 + p.x) * 15}%)`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = `hsl(${p.hue}, 100%, 60%)`;
                ctx.fill();
            });
            ctx.shadowBlur = 0;

            // 2. 中间的文字颗粒「赵文静」
            const tscale = beat;
            textParticles.forEach((p) => {
                const tx = cx + p.baseX * tscale + Math.sin(Date.now() / 600 + p.baseY * 0.06) * 1.5;
                const ty = cy + p.baseY * tscale + Math.cos(Date.now() / 600 + p.baseX * 0.06) * 1.5;
                p.x += (tx - p.x) * p.speed;
                p.y += (ty - p.y) * p.speed;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${p.hue}, 100%, ${62 + Math.sin(Date.now() / 300 + p.x) * 12}%)`;
                ctx.shadowBlur = 12;
                ctx.shadowColor = `hsl(${p.hue}, 100%, 60%)`;
                ctx.fill();
            });
            ctx.shadowBlur = 0;

            // 3. 点击飘出的爱心
            for (let i = floating.length - 1; i >= 0; i--) {
                const f = floating[i];
                f.x += f.vx;
                f.y += f.vy;
                f.rotation += f.vr;
                f.life -= 0.008;
                f.opacity = f.life;

                if (f.life <= 0 || f.y < -60) {
                    floating.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.translate(f.x, f.y);
                ctx.rotate(f.rotation);
                traceHeart(f.size / 32);
                ctx.fillStyle = `hsla(${f.hue}, 100%, 60%, ${f.opacity})`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = `hsla(${f.hue}, 100%, 60%, ${f.opacity})`;
                ctx.fill();
                ctx.restore();
            }
            ctx.shadowBlur = 0;

            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
